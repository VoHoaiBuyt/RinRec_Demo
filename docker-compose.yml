version: "3.9"

services:
  # ─── Backend: FastAPI REST API ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rinrec_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rinrec_net

  # ─── Frontend: Streamlit Web App ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rinrec_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./face_engine:/app/face_engine
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rinrec_net

networks:
  rinrec_net:
    driver: bridge
